spring.application.name=FProject
spring.cache.type=none

#Conexion config
spring.datasource.url=jdbc:mysql://localhost:3306/fproject
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Configuraci\u00f3n del pool de conexiones HikariCP
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000

# Configuraci\u00f3n del Thread Pool
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=30

#Update and debug config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#DB Credentials config
spring.datasource.username=${db.username}
spring.datasource.password=${db.password}

#swagger-ui config
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui/index.html
#URL: http://localhost:8080/swagger-ui/swagger-ui/index.html#/

#Auth config
min.password.length=8
max.password.length=16

#File managment
updload-dir=./images
max-img-event=3
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

#Security

#Enable in production
server.ssl.enabled=false
server.ssl.certificate=${ssl.public.cert}
server.ssl.certificate-private-key=${ssl.private.key}

#JWT config
jwt.secret.key=${security.jwt.secret-key}
jwt.expire.time=${security.jwt.expire-length}

#ShareCode Generator
characters.for.code=ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789
shareCode.character.long=20
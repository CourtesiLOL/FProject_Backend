spring.application.name=FProject

#Conexion config
spring.datasource.url=jdbc:mysql://localhost:3306/fproject
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

#Update and debug config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#DB Credentials config
spring.datasource.username=${db.username}
spring.datasource.password=${db.password}

#swagger-ui config
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui/index.html
#URL: https://localhost:8080/swagger-ui/swagger-ui/index.html#/

#Security
server.ssl.enabled=true
server.ssl.certificate=${ssl.public.cert}
server.ssl.certificate-private-key=${ssl.private.key}